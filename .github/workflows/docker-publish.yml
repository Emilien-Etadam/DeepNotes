name: Build and publish Docker images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            dockerfile: apps/client/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-client
          - service: app-server
            dockerfile: apps/app-server/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-app-server
          - service: collab-server
            dockerfile: apps/collab-server/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-collab-server
          - service: realtime-server
            dockerfile: apps/realtime-server/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-realtime-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: tags
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "tags=${{ matrix.image }}:latest,${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ matrix.image }}:dev-latest,${{ matrix.image }}:dev-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
