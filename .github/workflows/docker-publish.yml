name: Build and publish Docker images

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/emilien-etadam/deepnotes

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-client:latest,${{ env.IMAGE_PREFIX }}-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Build and push app-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app-server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-app-server:latest,${{ env.IMAGE_PREFIX }}-app-server:${{ github.sha }}
          cache-from: type=gha,scope=app-server
          cache-to: type=gha,mode=max,scope=app-server

      - name: Build and push collab-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/collab-server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-collab-server:latest,${{ env.IMAGE_PREFIX }}-collab-server:${{ github.sha }}
          cache-from: type=gha,scope=collab-server
          cache-to: type=gha,mode=max,scope=collab-server

      - name: Build and push realtime-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime-server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-realtime-server:latest,${{ env.IMAGE_PREFIX }}-realtime-server:${{ github.sha }}
          cache-from: type=gha,scope=realtime-server
          cache-to: type=gha,mode=max,scope=realtime-server
