name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --run

      - name: Audit dependencies
        # Non-blocking: vulnerabilities are tracked and managed via Dependabot updates.
        run: pnpm audit --audit-level=high || true

  docker-security:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            dockerfile: apps/client/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-client
          - service: app-server
            dockerfile: apps/app-server/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-app-server
          - service: collab-server
            dockerfile: apps/collab-server/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-collab-server
          - service: realtime-server
            dockerfile: apps/realtime-server/Dockerfile
            image: ghcr.io/emilien-etadam/deepnotes-realtime-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Grype image scan
        uses: anchore/scan-action@v6
        with:
          image: ${{ matrix.image }}:ci-${{ github.sha }}
          severity-cutoff: high
          fail-build: true
