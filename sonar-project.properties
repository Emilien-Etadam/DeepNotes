# SonarQube / SonarCloud — analyse du monorepo DeepNotes
# Voir docs/SONARQUBE.md pour lancer l'analyse.

sonar.host.url=http://192.168.30.111:9000
sonar.projectKey=Deepnotes
sonar.projectName=DeepNotes

# Sources : apps + packages (exclure build, config, assets non analysables)
sonar.sources=apps,packages
sonar.sourceEncoding=UTF-8

# Exclusions (alignées sur ESLint + dossiers générés)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.quasar/**,\
  **/*.tsbuildinfo,\
  **/src-capacitor/**,\
  **/src-electron/**,\
  **/src-ssr/**,\
  **/public/argon2-bundled.min.js,\
  **/postgres-init.sql,\
  **/patches/**,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/quasar.config.js,\
  **/quasar.config.cjs,\
  **/vite.config.ts,\
  **/vitest.config.ts,\
  **/eslint.config.mjs,\
  **/commitlint.config.js,\
  **/quasar.config.cjs.temporary.*

# Optionnel : si l'analyse est lente ou manque de mémoire (monorepo)
# sonar.typescript.tsconfigPaths=apps/client/tsconfig.json,apps/app-server/tsconfig.json
# sonar.javascript.node.maxspace=4096

# Couverture (décommenter après avoir configuré Vitest en mode coverage lcov)
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/__tests__/**,apps/client/**,**/env.ts,**/env-shared.ts,**/data-abstraction.ts,**/sockets.ts,apps/manager/**,packages/@stdlib/misc/src/dom.ts,packages/@stdlib/misc/src/clipboard.ts,packages/@stdlib/testing/src/smart-mock.ts,packages/@stdlib/vue/src/smart-computed.ts,packages/@stdlib/vue/src/smart-computed-dict.ts,packages/@stdlib/vue/src/vue.ts,packages/@deeplib/data/**,apps/app-server/src/index.ts,apps/app-server/src/utils/group-key-rotation.ts,apps/app-server/src/websocket/groups/rotate-keys.ts,apps/app-server/src/fastify/server.ts,apps/app-server/src/trpc/api/pages/snapshots/delete.ts,apps/app-server/src/websocket/users/account/email-change/finish.ts,apps/app-server/src/trpc/api/groups/get-pages.ts,apps/app-server/src/utils/groups.ts,apps/app-server/src/websocket/users/account/change-password.ts,apps/app-server/src/utils/devices.ts,apps/realtime-server/src/http-server.ts,apps/collab-server/src/http-server.ts,apps/collab-server/src/update-flushing.ts,apps/app-server/src/utils/notifications.ts,apps/app-server/src/trpc/api/users/pages/set-encrypted-default-arrow.ts,apps/app-server/src/trpc/api/users/pages/set-encrypted-default-note.ts
sonar.javascript.lcov.reportPaths=apps/app-server/coverage/lcov.info,packages/@stdlib/misc/coverage/lcov.info,packages/@stdlib/crypto/coverage/lcov.info
